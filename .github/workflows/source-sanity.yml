name: Source sanity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Build.PL syntax
        run: perl -c Build.PL

      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            first_line="$(head -n 1 "$file" || true)"
            case "$first_line" in
              *bash*) echo "bash -n $file"; bash -n "$file" ;;
              *'/sh'*) echo "dash -n $file"; dash -n "$file" ;;
              *) echo "Skipping unknown shell: $file" ;;
            esac
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

      - name: Check repository text files
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          errors = []
          binary_suffixes = {
              '.png', '.jpg', '.jpeg', '.gif', '.ico', '.zip', '.gz', '.bz2',
              '.stl', '.obj', '.amf', '.3mf', '.pdf', '.ttf', '.woff', '.dll',
              '.exe', '.so', '.a', '.o', '.dylib', '.mp3', '.mp4'
          }

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() in {'.json', '.webmanifest'}:
                  try:
                      json.loads(path.read_text(encoding='utf-8'))
                  except Exception as exc:
                      errors.append(f'{path.relative_to(root)}: invalid JSON ({exc})')
              if path.suffix.lower() in binary_suffixes or path.stat().st_size > 2_000_000:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for marker in ('<<<<<<< ', '=======\n', '>>>>>>> '):
                  if marker in text:
                      errors.append(f'{path.relative_to(root)}: unresolved merge marker {marker.strip()!r}')

          if errors:
              print('\n'.join(f'ERROR: {error}' for error in errors), file=sys.stderr)
              raise SystemExit(1)
          print('Source sanity checks passed.')
          PY
